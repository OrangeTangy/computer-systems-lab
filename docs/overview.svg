<g font-family="Arial,sans-serif">
<text x="35" y="45" fill="#f8fafc" font-size="25" font-weight="bold">THINK. FETCH. REMEMBER.</text>
<text x="35" y="74" fill="#cbd5e1" font-size="15">Three experiments that ask why a computer waits.</text>
<rect x="30" y="98" width="325" height="119" rx="12" fill="#1e3a5f"/>
<rect x="377" y="98" width="325" height="119" rx="12" fill="#134e4a"/>
