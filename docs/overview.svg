<g fill="#fff" font-size="21" font-weight="bold"><text x="50" y="135">01 / SIMD</text><text x="397" y="135">02 / MEMORY</text><text x="744" y="135">03 / SSD</text></g>
<g fill="#e2e8f0" font-size="15"><text x="50" y="165">Do several sums at once.</text><text x="50" y="191">When does wider math help?</text><text x="397" y="165">Find information nearby or far away.</text><text x="397" y="191">What makes us wait for data?</text><text x="744" y="165">Ask storage for many things.</text><text x="744" y="191">When does the queue get too long?</text></g>
